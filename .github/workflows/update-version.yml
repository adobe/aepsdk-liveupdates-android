name: Update Versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to use for the extension (ex: 1.2.3).'
        type: string
        required: true

      branch:
        description: 'The target branch where the version update will be applied and the pull request will be merged into.'
        type: string
        required: true

      core-dependency:
        description: |
          If a version is provided, update Core dependency in gradle.properties (ex: 1.2.3).
          This is a published dependency in the pom.xml file.
        type: string
        required: false
        default: ''

      edge-dependency:
        description: |
          If a version is provided, update Edge dependency in gradle.properties (ex: 1.2.3).
          This is a published dependency in the pom.xml file.
        type: string
        required: false
        default: ''

      messaging-dependency:
        description: |
          If a version is provided, update Messaging dependency in gradle.properties (ex: 1.2.3).
          This is a published dependency in the pom.xml file.
        type: string
        required: false
        default: ''

# NOTE: This is a stub registration so GitHub recognizes the workflow_dispatch
# trigger on the default branch. The real job (calling
# adobe/aepsdk-commons/.github/workflows/versions.yml) is still being developed
# on MOB-25516/github-actions-workflow and can be dispatched for testing via:
#   gh workflow run update-version.yml --ref MOB-25516/github-actions-workflow -f version=... -f branch=...
# Once finalized, replace the job below with the real reusable-workflow call.
jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Stub - no-op
        run: echo "update-version workflow stub - real logic pending on MOB-25516/github-actions-workflow"
